name: Release & Deploy Backend and Worker

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semver release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      deploy_to_sandbox:
        description: 'Deploy published digest-pinned images to AWS Sandbox EC2 via OIDC + SSM'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox-ec2-deploy
  cancel-in-progress: false

jobs:
  publish-images:
    name: Build, SBOM & Publish Backend + Worker Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.manifest.outputs.backend_image }}
      worker_image: ${{ steps.manifest.outputs.worker_image }}
      release_version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & audit supply chain
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          mkdir -p release-artifacts
          npm sbom --sbom-format=cyclonedx --omit=dev > release-artifacts/backend-sbom-cyclonedx.json

      - name: Resolve immutable version tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.release_tag }}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend API image
        id: push_backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilot-ai-backend:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilot-ai-backend:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker image
        id: push_worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilot-ai-worker:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/codepilot-ai-worker:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write immutable release manifest
        id: manifest
        run: |
          BACKEND_REF="${{ secrets.DOCKERHUB_USERNAME }}/codepilot-ai-backend@${{ steps.push_backend.outputs.digest }}"
          WORKER_REF="${{ secrets.DOCKERHUB_USERNAME }}/codepilot-ai-worker@${{ steps.push_worker.outputs.digest }}"
          echo "backend_image=${BACKEND_REF}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${WORKER_REF}" >> "$GITHUB_OUTPUT"
          cat <<EOF > release-artifacts/backend-release-manifest.json
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commitSha": "${GITHUB_SHA}",
            "releaseVersion": "${{ steps.meta.outputs.version }}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "images": {
              "backend": "${BACKEND_REF}",
              "worker": "${WORKER_REF}"
            }
          }
          EOF

      - name: Upload release manifest and CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-release-manifest-${{ steps.meta.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error

  deploy-sandbox:
    name: Serialized AWS Sandbox Rollout (OIDC + SSM)
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: ${{ inputs.deploy_to_sandbox == true }}

    steps:
      - name: Configure AWS credentials via GitHub OIDC (zero static keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Trigger idempotent EC2 rollout via AWS SSM SendCommand
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SANDBOX_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CodePilot AI backend/worker rollout ${{ needs.publish-images.outputs.release_version }}" \
            --parameters "commands=[\"/opt/codepilot-ai/user-data.sh '${{ needs.publish-images.outputs.backend_image }}' '${{ needs.publish-images.outputs.worker_image }}'\"]" \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.SANDBOX_EC2_INSTANCE_ID }}"
