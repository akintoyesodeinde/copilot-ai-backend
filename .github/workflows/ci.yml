name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Migrations, Tests & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: codepilot_ci
          MYSQL_USER: codepilot
          MYSQL_PASSWORD: ci_user_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucodepilot -pci_user_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://codepilot:ci_user_password@127.0.0.1:3306/codepilot_ci
      APP_URL: http://localhost:4000
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-test-only-session-secret-must-be-32-chars-minimum
      COOKIE_SECURE: 'false'
      RATE_LIMIT_LOGIN_MAX: '50'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Execute MySQL migrations
        run: npm run db:migrate:deploy

      - name: Verify zero Prisma schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed database and verify idempotency
        run: |
          npm run db:seed
          npm run db:seed

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run authorization and tenant isolation tests
        run: npm run test:authz

      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

      - name: Build production Next.js application
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: test-results/
          if-no-files-found: error

  docker-build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [quality-and-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: codepilot-ai-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
