services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: codepilot-backend
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      PORT: '4000'
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:4000:4000'
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4000/api/v1/health/live\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  worker:
    image: ${WORKER_IMAGE}
    container_name: codepilot-worker
    restart: unless-stopped
    env_file:
      - .env.runtime
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: codepilot-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  nginx:
    image: nginx:1.27-alpine
    container_name: codepilot-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
